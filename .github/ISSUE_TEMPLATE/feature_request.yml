name: Feature request
description: Suggest something the journal should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to see or do in your journal, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch or screenshot of another tool is welcome.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This keeps the journal local first (no new account, cloud service or telemetry).
